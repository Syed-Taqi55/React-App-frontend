name: Test and Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build Docker Image
        run: docker build -t syedtaqi879/frontendapp:latest .

      - name: Publish Image to Docker Hub
        run: docker push syedtaqi879/frontendapp:latest

  deploy:
    needs: build
    runs-on: aws-ec2

    steps:
      - name: Pull image from dockerhub
        run: docker pull syedtaqi879/frontendapp:latest
      - name: Delete Old Container
        run: docker rm -f reactContainer  
      - name: run docker container
        run: docker run -d -p 3000:80 --name reactContainer syedtaqi879/frontendapp